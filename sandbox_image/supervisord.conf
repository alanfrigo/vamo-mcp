[unix_http_server]
file=/run/supervisor.sock
chmod=0700
chown=agent:agent

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:xvfb]
command=Xvfb :99 -screen 0 1280x800x24 -auth /home/agent/.Xauthority -nolisten tcp -nolisten local +extension GLX +render -noreset
priority=10
user=agent
startsecs=1
startretries=2
autorestart=unexpected
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:openbox]
command=/bin/sh -c '/opt/venv/bin/python /opt/agent_daemon/main.py wait-x && exec dbus-run-session -- openbox-session'
priority=20
user=agent
startsecs=1
startretries=2
autorestart=unexpected
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:chromium]
command=/bin/sh -c '/opt/venv/bin/python /opt/agent_daemon/main.py wait-wm && exec /opt/venv/bin/python /opt/agent_daemon/main.py browser about:blank'
priority=30
user=agent
startsecs=1
startretries=2
autorestart=unexpected
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:x11vnc]
command=/bin/sh -c '/opt/venv/bin/python /opt/agent_daemon/main.py wait-x && exec x11vnc -display :99 -forever -shared -localhost -no6 -noipv6 -listen 127.0.0.1 -rfbportv6 -1 -rfbport %(ENV_VNC_PORT)s -rfbauth /home/agent/.vnc/passwd -viewonly'
priority=40
user=agent
startsecs=1
startretries=2
autorestart=unexpected
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:novnc]
command=websockify --web=/usr/share/novnc/ 127.0.0.1:%(ENV_NOVNC_PORT)s 127.0.0.1:%(ENV_VNC_PORT)s
priority=40
user=agent
startsecs=1
startretries=2
autorestart=unexpected
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:agent_daemon]
command=/opt/venv/bin/uvicorn main:app --host 127.0.0.1 --port %(ENV_DAEMON_PORT)s --workers 1 --no-access-log --no-proxy-headers
priority=50
user=agent
startsecs=1
startretries=2
autorestart=unexpected
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
